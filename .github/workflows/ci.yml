name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAS_TEST_BROWSER: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src/praxis_agent
      - name: CLI smoke tests
        run: |
          praxis --help
          praxis-benchmark --help
          praxis-experience --help
          praxis doctor
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Runtime mutation checks
        run: python scripts/check_runtime_mutations.py

  browser:
    name: Chromium integration / scripted model
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAS_TEST_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Browser readiness
        run: praxis doctor --browser
      - name: Real Chromium integration tests with scripted model endpoint
        run: python -m unittest discover -s tests -p test_browser_goal.py -v
      - name: Reproducible browser demonstration
        run: praxis demo --output demo-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-browser-demo
          path: demo-run/
          if-no-files-found: ignore
          retention-days: 14
