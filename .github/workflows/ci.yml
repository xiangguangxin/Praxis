name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAS_TEST_BROWSER: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src/praxis_agent
      - name: CLI smoke tests
        run: |
          praxis --help
          praxis-benchmark --help
          praxis-experience --help
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Runtime mutation checks
        run: python scripts/check_runtime_mutations.py
