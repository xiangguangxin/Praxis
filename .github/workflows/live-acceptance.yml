name: Live model acceptance

# Real-provider tests are explicit, separately labelled and never run on PRs.
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Authorized backend (Nova requires a configured self-hosted desktop)
        required: true
        type: choice
        options: [browser, nova]
      repeat:
        description: Number of independently verified trials
        type: choice
        options: ["1", "3", "5"]
        default: "3"

permissions:
  contents: read

jobs:
  browser:
    if: inputs.backend == 'browser'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRAXIS_MODEL: ${{ vars.PRAXIS_MODEL }}
      PRAXIS_API_URL: ${{ vars.PRAXIS_API_URL }}
      PRAXIS_API_KEY: ${{ secrets.PRAXIS_API_KEY }}
      TRIALS: ${{ inputs.repeat }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[browser]"
      - run: python scripts/provision_ci_browser.py
      - run: praxis doctor --browser --browser-executable "$OPENAS_TEST_BROWSER_EXECUTABLE" --check-model
      - name: Evaluate real provider against local browser fixture
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory examples/coverage-web &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          python scripts/wait_for_fixture.py http://127.0.0.1:8765/
          praxis-benchmark examples/live-coverage-suite.json --browser-url http://127.0.0.1:8765/ --browser-executable "$OPENAS_TEST_BROWSER_EXECUTABLE" --repeat "$TRIALS" --output live-browser-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-browser-acceptance
          path: live-browser-report.json
          if-no-files-found: ignore

  nova:
    if: inputs.backend == 'nova'
    # Operator-managed Windows/macOS machine, never a general shared runner.
    runs-on: [self-hosted, praxis-desktop]
    timeout-minutes: 30
    env:
      PRAXIS_MODEL: ${{ vars.PRAXIS_MODEL }}
      PRAXIS_API_URL: ${{ vars.PRAXIS_API_URL }}
      PRAXIS_API_KEY: ${{ secrets.PRAXIS_API_KEY }}
      NOVA_EXECUTABLE: ${{ vars.NOVA_EXECUTABLE }}
      NOVA_SUITE: ${{ vars.NOVA_SUITE }}
      TRIALS: ${{ inputs.repeat }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Evaluate authorized resettable desktop fixture
        shell: bash
        run: |
          praxis doctor --nova "$NOVA_EXECUTABLE" --check-model
          praxis-benchmark "$NOVA_SUITE" --nova "$NOVA_EXECUTABLE" --repeat "$TRIALS" --output live-nova-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-nova-acceptance
          path: live-nova-report.json
          if-no-files-found: ignore
